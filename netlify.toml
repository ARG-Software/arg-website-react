[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["netlify/functions/assets/*"]

[[edge_functions]]
  function = "markdownNegotiation"
  path = "/*"
  excludedPath = ["/assets/*", "/images/*", "/icons/*", "/fonts/*", "/videos/*", "/files/*"]

[[plugins]]
  package = "@netlify/plugin-lighthouse"

[[plugins]]
  package = "./plugins/netlify-indexnow"

[dev]
  command = "npm run dev"
  port = 3000
